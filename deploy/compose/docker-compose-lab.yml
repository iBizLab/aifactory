services:
  #mysql
  mysql:
    image: ${IMAGE_URL}mysql:5.7.26.ibiz
    container_name: mysql
    ports:
    - "3306:3306"
    environment:
    - TZ=Asia/Shanghai
    - MYSQL_ROOT_PASSWORD=Mysql@2022
    volumes:
    - mysql_data:/var/lib/mysql
    networks:
    - agent_network
    command: mysqld

  postgres:
    image: ${IMAGE_URL}pgvector:pg16-zhparser-age
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
    - postgres_data:/var/lib/postgresql/data/pgdata
    networks:
      - agent_network
    environment:
      - TZ=Asia/Shanghai
      - PGUSER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ai_factory
      - PGDATA=/var/lib/postgresql/data/pgdata

  #nacos
  nacos:
    image: ${IMAGE_URL}nacos-server:v2.0.3
    container_name: nacos
    ports:
    - "8848:8848"
    environment:
    - TZ=Asia/Shanghai
    - PREFER_HOST_MODE=hostname
    - MODE=standalone
    - SPRING_DATASOURCE_PLATFORM=mysql
    - MYSQL_SERVICE_HOST=mysql
    - MYSQL_SERVICE_DB_NAME=nacos_conf
    - MYSQL_SERVICE_PORT=3306
    - MYSQL_SERVICE_USER=nacos
    - MYSQL_SERVICE_PASSWORD=Nacos@2022
    - JVM_XMS=256m
    - JVM_XMX=1024m
    networks:
      - agent_network
    entrypoint:
    - /entrypoint-waitfor.sh
    command: mysql:3306


  #redis
  redis:
    image: ${IMAGE_URL}redis:6.2.6
    container_name: redis
    ports:
    - "6379:6379"
    environment:
    - TZ=Asia/Shanghai
    logging:
      driver: "json-file"
    networks:
    - agent_network
    command: redis-server


  #zookeeper
  zoo1:
    image: ${IMAGE_URL}zookeeper:3.7.0
    container_name: zoo1
    ports:
    - "2181:2181"
    environment:
    - TZ=Asia/Shanghai
    - ZOO_MY_ID=1
    - ZOO_SERVERS=server.1=0.0.0.0:2888:3888;2181
    networks:
    - agent_network


  #emqx
  emqx:
    image: ${IMAGE_URL}emqx:4.4
    container_name: emqx
    ports:
    - "8083:8083"
    environment:
    - TZ=Asia/Shanghai
    networks:
    - agent_network


  #ibiz-ebsx-allinone
  ibiz-ebsx-allinone:
    env_file: .lab
    image: ${IMAGE_URL}ibiz-ebsx-allinone-rt:8.1.0.578.171
    container_name: ibiz-ebsx-allinone
    ports:
      - "30000:30000"
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=30000
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=ibiz-ebsx-allinone
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=http://nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=http://nacos:8848
      - SPRING_DATASOURCE_DRIVER-CLASS-NAME=com.mysql.jdbc.Driver
      - SPRING_DATASOURCE_PASSWORD=9d@A178@
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/a_lab01_3f9ebc219?autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&useOldAliasMetadataBehavior=true&serverTimezone=GMT%2B8&allowMultiQueries=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=a_lab01_3f9ebc219
      - JAVA_OPTS=-Xms512m -Xmx2048m -Xss1024K
      - IBIZ_SERVICEHUB_INITMODE=auto
    volumes:
      - allinone_data:/app/file
    networks:
      agent_network:
        aliases:
          - nacos.ibizcloud.cn
    entrypoint: /entrypoint-waitfor.sh
    command: nacos:8848


  #pyservice
  pyservice:
    image: ${IMAGE_URL}pyservice:20260104.01
    container_name: pyservice
    network_mode: "service:ibiz-ebsx-allinone"


  #ibizlab-uaa-api
  ibizlab-uaa-api:
    env_file: .lab
    image: ${IMAGE_URL}uaa-standalone:2.1.9
    container_name: ibizlab-uaa-api
    ports:
      - "32666:32666"
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=32666
      - IBIZ_SERVICEHUB_ID=ibizuaa
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=ibizlab-uaa-api
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=http://nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=http://nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_GROUP=ibiz_config_group
      - SPRING_CLOUD_NACOS_CONFIG_GROUP=ibiz_config_group
      - JAVA_OPTS=-Xms256m -Xmx1024m -Xss256K
    networks:
      - agent_network
    entrypoint: /entrypoint-waitfor.sh
    command: ibiz-ebsx-allinone:30000


  #ibiz-ebsx-gateway
  ibiz-ebsx-gateway:
    env_file: .lab
    image: ${IMAGE_URL}ibiz-ebsx-gateway:8.1.0.377-b2
    container_name: ibiz-ebsx-gateway
    ports:
      - "30086:30086"
    environment:
      - TZ=Asia/Shanghai
      - SERVER_PORT=30086
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=ibiz-ebsx-gateway
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=http://nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=http://nacos:8848
      - JAVA_OPTS=-Xms256m -Xmx512m -Xss256K
    networks:
      agent_network:
        aliases:
          - gateway.ibizcloud.cn
    entrypoint: /entrypoint-waitfor.sh
    command: ibizlab-uaa-api:32666


  #aifactoryservice
  aifactoryservice:
    env_file: .lab
    image: ${IMAGE_URL}ibiz-service-runner:8.1.0.578.171-jdk
    container_name: aifactoryservice
    ports:
      - "30281:30281"
    networks:
      - agent_network
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CLOUD_NACOS_DISCOVERY_SERVER-ADDR=http://nacos:8848
      - SPRING_CLOUD_NACOS_CONFIG_SERVER-ADDR=http://nacos:8848
      - SPRING_CLOUD_NACOS_DISCOVERY_IP=aifactoryservice
      - SERVER_PORT=30281
      - IBIZ_SERVICEHUB_INITMODE=auto
      - IBIZ_SERVICEHUB_DATASOURCES_MASTER_DBTYPE=POSTGRESQL
      - SPRING_DATASOURCE_DRIVER-CLASS-NAME=org.postgresql.Driver
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ai_factory?ssl=false
      - SPRING_DATASOURCE_USERNAME=postgres
      - IBIZ_SERVICEHUB_ENABLERELOADSYSTEM=true
      - JAVA_OPTS=-Xms512m -Xmx2048m -Xss1024K
    entrypoint: /entrypoint-waitfor.sh
    command: ibiz-ebsx-gateway:30086


  #aifactoryweb
  aifactoryweb:
    env_file: .lab
    image: ${IMAGE_URL}ibiz-cloud-web-runner:9.0.7.41-alpha.92.aifactory.260518
    container_name: aifactoryweb
    ports:
      - 30280:80
    networks:
      - agent_network
    environment:
      - TZ=Asia/Shanghai
      - MOCKDCSYSTEMID=ibizaifactory
      - APPNAME=aifactoryweb
      - APPCODE=aifactoryweb
      - APICODE=ibizaifactory__aifactoryweb
      - BASEURL=ibizaifactory__aifactoryweb
      - PLUGINBASEURL=./plugins

volumes:
  mysql_data:
    driver: local
  allinone_data:
    driver: local
  postgres_data:
    driver: local

networks:
  agent_network:
    driver: bridge
    attachable: true
